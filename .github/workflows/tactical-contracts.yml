name: Tactical Contracts — hiring leads

# Watches federal contract awards for human performance work and reports who
# just won one.
#
# WHY THIS RUNS AT ALL: when a contractor wins an H2F or POTFF contract they
# must staff it, and they start hiring within weeks. The award is public before
# any job posting exists. Serco's January 2025 Army H2F award came with a plan
# to hire over 350 strength and conditioning coaches in the base year -- more
# tactical S&C hiring than most boards in this niche show in a year, and
# knowable months ahead of the postings.
#
# Source is USASpending.gov, whose API is fully open. No key, no account.

on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "How far back to look"
        type: string
        default: "180"
      open_issue:
        description: "Open a GitHub issue with the leads"
        type: boolean
        default: true
  schedule:
    # Mondays 08:00 UTC. Awards post on business days; weekly is the right
    # cadence for a signal measured in weeks-to-hire.
    - cron: "0 8 * * 1"

concurrency:
  group: tactical-contracts
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    working-directory: jobs-scraper

jobs:
  leads:
    name: Scan awards for hiring leads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan USASpending
        id: scan
        env:
          SINCE_DAYS: ${{ inputs.since_days || '180' }}
        run: |
          python - <<'PY'
          import os, pathlib
          from tactical_jobs.contracts import fetch_awards, render_leads

          since = int(os.environ.get("SINCE_DAYS") or 180)
          out = pathlib.Path("leads.md")
          try:
              awards = fetch_awards(since_days=since, limit=100, max_pages=5)
          except Exception as exc:
              # A failed scan is a quiet week, not a broken repo. Record it
              # readably and let the step succeed so the schedule keeps running.
              out.write_text(
                  f"# Contract scan unavailable\n\nUSASpending request failed: `{exc}`\n"
              )
              awards = []
          else:
              out.write_text(render_leads(awards, top_n=25))

          # The issue step gates on this count, not on the prose: the rendered
          # header contains the words "award" and "recipient" even when the
          # scan found nothing, so any text match would open an empty issue
          # every single week.
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"count={len(awards)}\n")
          print(f"{len(awards)} relevant award(s)")
          PY

      - name: Job summary
        if: always()
        run: cat leads.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-leads
          path: jobs-scraper/leads.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Open an issue with the leads
        # Gated on the award COUNT, so a quiet week or a failed scan does not
        # create a stream of empty issues.
        if: ${{ inputs.open_issue != false && steps.scan.outputs.count != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('jobs-scraper/leads.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tactical human performance contract leads — ${today}`,
              labels: ['contract-leads'],
              body: body.slice(0, 60000) +
                '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
