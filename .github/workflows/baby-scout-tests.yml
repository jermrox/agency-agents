# Deal scoring, recall matching and the safety gates are pure logic with
# recorded fixtures, so they run offline on every change.
name: Baby scout tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'baby-scout/**'
      - '.github/workflows/baby-scout-tests.yml'
  pull_request:
    paths:
      - 'baby-scout/**'
      - '.github/workflows/baby-scout-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run the tests
        run: python -m pytest baby-scout/tests -q
      - name: Smoke-test the CLI offline
        working-directory: baby-scout
        run: |
          D=$(mktemp -d)
          cp watchlist.example.toml "$D/watchlist.toml"
          python -m baby_scout add-price --data "$D" --key nestwell-cozy-dream --retailer "Example Mart" --price 129.99
          python -m baby_scout bought --data "$D" --key bramble-roam-convertible --price 239.99 --retailer "Big Box"
          python -m baby_scout run --data "$D" --site "$D/site" --offline --recalls-file tests/fixtures/cpsc_sample.json
          test -s "$D/site/index.html" && test -s "$D/site/data.json"
          ls "$D/reports"/*.json
