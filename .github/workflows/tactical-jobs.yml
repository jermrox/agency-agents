name: Tactical Jobs — nightly

# Collects tactical human performance roles, scores them, enriches and archives
# them, publishes the live board, and deploys the board + dashboard to GitHub
# Pages so the Squarespace embed has something to fetch.
#
# Squarespace has no content-write API, so this is the mechanism by which a job
# reaches mopsnmoes.com: this workflow publishes jobs.json, and the Code Block
# on the site renders it. See jobs-scraper/embed/squarespace-jobs.html.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Score and report without publishing or writing state"
        type: boolean
        default: false
      config:
        description: "Config file to run"
        type: choice
        default: sources.keyless.toml
        options:
          - sources.keyless.toml
          - sources.toml
          - sources.example.toml
  schedule:
    # 07:00 UTC = 02:00 America/Chicago, the site's timezone. Quiet hours, and
    # after overnight US postings land.
    - cron: "0 7 * * *"
    # 19:00 UTC = 14:00 America/Chicago -- a second pass so same-day closures
    # come off the board same-day.
    - cron: "0 19 * * *"

concurrency:
  group: tactical-jobs
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: jobs-scraper

jobs:
  scrape:
    name: Collect, score, publish
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The package has no runtime dependencies; pytest is dev-only. Tests run
      # first because a broken classifier publishing to a public site is worse
      # than a night with no update.
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Select config
        id: cfg
        run: |
          CONFIG="${{ inputs.config || 'sources.keyless.toml' }}"
          if [ ! -f "$CONFIG" ]; then
            echo "::warning::$CONFIG not found; falling back to sources.keyless.toml"
            CONFIG=sources.keyless.toml
          fi
          echo "path=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "Using $CONFIG"

      - name: Run scraper
        id: run
        env:
          # Only set if the operator has them. Every source in the keyless
          # config runs without any of these.
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python -m tactical_jobs run --config "${{ steps.cfg.outputs.path }}" $DRY 2>&1 | tee run.log
          if grep -q "^approved" run.log; then
            echo "published=$(grep '^approved' run.log | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Nightly run"
            echo ""
            echo '```'
            cat run.log 2>/dev/null || echo "no run log produced"
            echo '```'
            if [ -f output/insights/digest.md ]; then
              echo ""
              echo "<details><summary>Market digest</summary>"
              echo ""
              cat output/insights/digest.md
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review queue and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: |
            jobs-scraper/output/
            jobs-scraper/run.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit board, corpus, and state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-add: output/ and state/ are gitignored so a local run cannot
          # commit synthetic data, but the scheduled run's real artifacts are
          # exactly what must persist between runs.
          git add -f output state
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(jobs): nightly board update [skip ci]"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "Push failed; refreshing and retrying (attempt $attempt)."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push the updated board after 4 attempts."
          exit 1

      - name: Assemble the published site
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p ../site
          # Custom domain. Set the repository VARIABLE JOBS_DOMAIN (Settings ->
          # Secrets and variables -> Actions -> Variables) to e.g.
          # jobs.mopsnmoes.com and every deploy re-writes the CNAME file.
          # Without the CNAME on each deploy GitHub Pages drops the custom
          # domain the first time a workflow publishes a fresh artifact.
          if [ -n "${{ vars.JOBS_DOMAIN }}" ]; then
            echo "${{ vars.JOBS_DOMAIN }}" > ../site/CNAME
            echo "Custom domain: ${{ vars.JOBS_DOMAIN }}"
          fi
          # Serve the feed with permissive CORS. GitHub Pages already sends
          # Access-Control-Allow-Origin: *, but this keeps the intent explicit
          # for any other static host the site directory gets copied to.
          echo '/*' > ../site/_headers
          echo '  Access-Control-Allow-Origin: *' >> ../site/_headers
          # The feed the Squarespace embed fetches, plus the dashboard.
          cp -f output/jobs.json          ../site/ 2>/dev/null || echo '{"version":1,"count":0,"jobs":[]}' > ../site/jobs.json
          cp -f output/jobs.xml           ../site/ 2>/dev/null || true
          cp -f output/insights/dashboard.html ../site/ 2>/dev/null || true
          cp -f output/insights/insights.json  ../site/ 2>/dev/null || true
          # Shipped as embed.html for the Squarespace Code Block, and wrapped
          # as index.html so the Pages root renders the board directly.
          cp -f embed/board.html ../site/embed.html
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<title>MOPs &amp; MOEs — Tactical Human Performance Jobs</title>'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<style>body{margin:0;padding:1.25rem;background:#f6f2ea;'
            echo 'font:16px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}'
            echo '@media(prefers-color-scheme:dark){body{background:#0f0d0b}}</style>'
            echo '</head><body>'
            cat embed/board.html
            echo '<p style="max-width:64rem;margin:2rem auto 0;font:13px/1.6 -apple-system,sans-serif;color:#8a8071">'
            echo 'Machine-readable: <a href="jobs.json" style="color:#b18a45">jobs.json</a> ·'
            echo '<a href="jobs.xml" style="color:#b18a45">RSS</a> · <a href="insights.json" style="color:#b18a45">insights.json</a> ·'
            echo '<a href="dashboard.html" style="color:#b18a45">market dashboard</a></p>'
            echo '</body></html>'
          } > ../site/index.html
          ls -la ../site

      # Only worth producing when something will deploy it -- see the deploy
      # job below for why that is opt-in.
      - name: Upload Pages artifact
        if: ${{ inputs.dry_run != true && vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy board to GitHub Pages
    # OPT-IN. This job failed every one of the first 45 nightly runs at
    # actions/configure-pages, because GitHub Pages was never enabled for the
    # repository (Settings -> Pages -> Source: GitHub Actions). Nothing else was
    # ever wrong: the scrape job collected, scored, committed and published
    # normally on every one of those runs. But the run as a whole reported
    # failure, which trains everyone to ignore the only alarm this pipeline has,
    # so a genuine scrape failure would have looked identical to the noise.
    #
    # To turn it back on: enable Pages in Settings, then set the repository
    # VARIABLE ENABLE_PAGES to "true". Left in place rather than deleted so that
    # stays a one-line change.
    #
    # Also only from the default branch: a feature branch must never repoint the
    # live feed the website reads.
    if: ${{ vars.ENABLE_PAGES == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.dry_run != true }}
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Point the embed at this URL
        run: |
          echo "### Board published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set \`FEED_URL\` in the Squarespace Code Block to:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}jobs.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
