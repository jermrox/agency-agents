name: Tactical Jobs Scraper

# Collects tactical human performance roles, scores them, publishes the clear
# matches to the website feed, and commits the updated board + dedupe state.
#
# The scheduled run always publishes for real. The manual trigger exposes a
# dry-run checkbox for when you want to inspect scoring without touching the
# board.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Score and report without publishing or writing state"
        type: boolean
        default: false
  schedule:
    # 07:00 UTC daily = 02:00 in the site's timezone (America/Chicago, per
    # Squarespace config) — quiet hours, and after overnight postings land.
    - cron: "0 7 * * *"

# Prevent two runs from racing on the same state file.
concurrency:
  group: tactical-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Collect and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs-scraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The package itself has no dependencies; pytest is dev-only.
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Prepare config
        run: |
          if [ ! -f sources.toml ]; then
            echo "No sources.toml committed; using the example config."
            cp sources.example.toml sources.toml
          fi

      - name: Run scraper
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          python -m tactical_jobs run --config sources.toml $DRY 2>&1 | tee run.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Tactical jobs run"
            echo ""
            echo '```'
            cat run.log 2>/dev/null || echo "no run log produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: |
            jobs-scraper/output/
            jobs-scraper/run.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit board and state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          # Only commit when something actually changed.
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(jobs): update tactical jobs board [skip ci]"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push failed; refreshing and retrying (attempt $attempt)."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push updated board after 4 attempts."
          exit 1
