name: Funding sweep — daily

# Collects open non-dilutive funding opportunities and publishes funding.json
# for the Vybe funding dashboard to read.
#
# WHY THIS RUNS IN CI AND NOT LOCALLY
# The federal APIs this reads (sbir.gov, grants.gov) are open and keyless, but
# they are unreachable from sandboxed agent environments behind an egress
# allowlist. A GitHub Actions runner has open outbound network, so this is the
# one place the sweep can actually see the whole federal picture.
#
# CADENCE
# Daily, at 13:40 UTC. The live site (agentrevup) is expected to update every
# day: the daily Vybe routine adds verified rows to sources.toml at 12:00 UTC,
# and this run is what turns them into funding.json. Biweekly left the live
# board up to two weeks behind its own source file (it sat five days stale on
# 29 Sep). A run takes about a minute, so daily costs almost nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and report without writing funding.json"
        type: boolean
        default: false
      only:
        description: "Run only these sources (comma-separated). Read-only: forces a dry run."
        type: string
        default: ""
      verbose:
        description: "Print every collected row in full (use with dry_run to audit a new source)"
        type: boolean
        default: false
  schedule:
    # 13:40 UTC daily: after the 12:00 daily routine, before the 14:20 live-site
    # check. Off the hour on purpose -- :00 is when every scheduled workflow on
    # the platform fires at once.
    - cron: "40 13 * * *"

concurrency:
  group: funding-sweep
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: funding-scraper

jobs:
  sweep:
    name: Collect and publish funding.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No install step: the package is standard library only, by design.
      - name: Collect opportunities
        id: run
        env:
          # Through the environment, not the command line: a workflow input is
          # attacker-controlled in the general case and must never be spliced
          # into a shell.
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERBOSE: ${{ inputs.verbose }}
          # SAM.gov contract opportunities (sources.sam_contracts). A repository
          # secret, never config: the source skips itself when it is unset.
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          # Every conditional here is a full `if`, never `[ ... ] && ...`.
          # The step runs under `bash -e`, where a bare test that evaluates
          # false is a failing command and aborts the step -- and on the
          # scheduled run these inputs are empty, so every test is false.
          # That idiom silently broke two site checkers already.
          args=(run --config sources.toml)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$VERBOSE" = "true" ]; then
            args+=(--verbose)
          fi
          # --only implies --dry-run in the CLI, so a partial run can never
          # publish a board missing every source it skipped.
          IFS=',' read -ra wanted <<< "${ONLY:-}"
          for name in "${wanted[@]}"; do
            name="$(echo "$name" | tr -d '[:space:]')"
            if [ -n "$name" ]; then
              args+=(--only "$name")
            fi
          done
          python3 -m vybe_funding "${args[@]}" | tee sweep.log
        # A dead upstream API exits non-zero but still writes the file. Keep
        # going so a partially-fresh board still publishes, and surface the
        # failure in the summary instead of failing the whole run.
        continue-on-error: true

      # The dashboard's built-in list is generated, never edited. Regenerating
      # it here is what keeps the offline fallback from drifting away from the
      # feed as sources.toml grows.
      - name: Sync the dashboard's built-in list
        if: ${{ inputs.dry_run != true && inputs.only == '' }}
        run: python3 ../scripts/sync-funding-dashboard.py

      - name: Report to the run summary
        run: |
          {
            echo '### Funding sweep'
            echo ''
            echo '```'
            cat sweep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the refreshed board
        if: ${{ inputs.dry_run != true && inputs.only == '' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- funding-scraper/output/funding.json dashboards/vybe-funding-tracker.html; then
            echo "No change to the feed or the dashboard — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funding-scraper/output/funding.json dashboards/vybe-funding-tracker.html
          # No [skip ci] here. Netlify honours that marker and skips the deploy,
          # so a sweep commit carrying it refreshed main and never reached the
          # live site. It was also redundant: a push made with GITHUB_TOKEN does
          # not trigger other workflows in the first place.
          git commit -m "chore(funding): daily sweep"
          # The ref can move while the sweep runs: on 29 Sep a PR merged 30
          # seconds into a run and the bare `git push` was rejected, losing the
          # whole refresh. Daily runs make that race more likely, so rebase onto
          # whatever landed and retry. The sweep only writes these two files, so
          # a conflict means someone else changed them mid-run: fail loudly
          # rather than guess which version wins.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$REF_NAME"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt): $REF_NAME moved during the sweep; rebasing onto it."
            if ! git pull --rebase origin "$REF_NAME"; then
              git rebase --abort || true
              echo "::error::Rebase onto $REF_NAME conflicted: funding.json or the dashboard changed during the sweep."
              exit 1
            fi
          done
          echo "::error::Push to $REF_NAME was rejected three times."
          exit 1
