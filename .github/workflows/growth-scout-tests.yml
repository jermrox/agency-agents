name: Growth Scout — tests

# Validates the Vybe Growth Scout (growth-scout/): the builder's rules, the raw
# lane files, and that the committed dashboard rebuilds cleanly.

on:
  pull_request:
    paths: ["growth-scout/**", ".github/workflows/growth-scout-tests.yml"]
  push:
    branches: [main]
    paths: ["growth-scout/**", ".github/workflows/growth-scout-tests.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: growth-scout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests -q
      - name: Validate lane files
        run: python build.py --check
