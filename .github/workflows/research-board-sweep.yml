name: Research board sweep

# The weekly sweep from the v2 brief. It runs here rather than in an
# interactive session for one reason: outbound fetch works on a runner and is
# blocked in the authoring sandbox, and the brief requires every blurb to be
# written from the fetched primary document rather than from coverage of it.
#
# This job does not write blurbs. It produces candidates.json — one entry per
# clustered primary document, carrying the text a blurb has to be written from.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'          # Mondays, alongside the standards watch

permissions:
  contents: read

concurrency:
  group: research-board-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Crawl the registry and fetch primary documents
        run: python research-board/sweep.py | tee /tmp/sweep.log

      - name: Summarise the run
        run: |
          {
            echo '## Research board sweep'
            echo
            echo '```'
            tail -n 12 /tmp/sweep.log
            echo '```'
            echo
            echo 'Blurbs are written from the document text in the artifact below, never from coverage.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the candidates for whoever writes the blurbs
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: research-board/candidates.json
          retention-days: 30
          if-no-files-found: error
