# -----------------------------------------------------------------------------
# 6. ASSOCIATION CAREER CENTERS
#
# NSCA, NATA, ACSM, CSCCa, and AASP run job boards that are pure signal for
# this niche. Most expose RSS. Keyless.
# -----------------------------------------------------------------------------

# [[source]]
# kind = "jobsrss"
# name = "nsca"
# url = "https://careers.nsca.com/jobs/feed"
# employer_from = "title"


# -----------------------------------------------------------------------------
# PUBLISHERS -- all keyless. Discord is the only one that would need a secret,
# and it is a webhook URL rather than an API key.
# -----------------------------------------------------------------------------

[[publisher]]
kind = "jsonfeed"
path = "output/jobs.json"
retain_days = 45

[[publisher]]
kind = "review"
path = "output/review-queue.md"

[[publisher]]
kind = "rss"
path = "output/jobs.xml"
source_feed = "output/jobs.json"
limit = 50
title = "MOPs & MOEs — Tactical Human Performance Jobs"
link = "https://www.mopsnmoes.com/jobs"
