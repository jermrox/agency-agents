# -----------------------------------------------------------------------------
# 3. FEDERAL -- USAJOBS, the ONE source in this file that needs a credential
#
# CHECKED 2026-08-07: USAJOBS has no keyless route. /Search/ResultsRss (the
# legacy RSS export) 404s -- it was retired. The site's own search results
# are rendered client-side by POSTing to /Search/ExecuteSearch with a
# same-origin CSRF token and session cookie, behind Akamai bot detection --
# not something a scheduled script should be built to fight through.
#
# The correct route is USAJOBS's own public Search API, and as of 2026-08-28
# it is REGISTERED AND ENABLED (see the block below). It costs nothing and
# takes a couple of minutes to sign up for.
#
# The two secrets the nightly workflow already passes through must be set for
# it to run in CI -- Settings -> Secrets and variables -> Actions:
#     USAJOBS_API_KEY      the key from developer.usajobs.gov
#     USAJOBS_USER_AGENT   the email the key was registered with
# Until both exist, the source disables itself with a warning and the rest of
# the run proceeds normally; it does not fail the build. Check a run's log for
# "source 'federal' disabled" to tell "no secret" apart from "no results".
#
# This was the highest-value source not yet enabled: Army H2F, Navy and Air
# Force human performance billets post here first and often nowhere else.
# -----------------------------------------------------------------------------

# --- VERIFIED LIVE 2026-08-28 -----------------------------------------------
# ENABLED. The API key exists now, so this source is on.
#
# `optional = true` is what lets a credentialed source live in a file whose
# whole promise is that it runs with no credentials. When USAJOBS_API_KEY is
# unset the source is dropped with a warning and every other source still
# runs; the "zero-credential" guarantee at the top of this file therefore
# still holds exactly as written. Nothing else in the config gets that
# leniency -- an unset variable anywhere else is still a hard startup error.
#
# Verified against the live API today with the real key: HTTP 200,
# SearchResultCountAll=16 for "strength and conditioning" alone, returning
# work that appears on NO other source in this file --
#   HITT Instructor Level I ............... U.S. Marine Corps, Jacksonville NC
#   WARR Technician, Health Promotion ..... U.S. Marine Corps, Camp Schwab JP
#   Supervisory Performance Education Spec  U.S. Marine Corps, 29 Palms CA
#   Fitness Specialist .................... Navy Installations Cmd, Norfolk VA
#   Recreation Assistant (Fitness Center) . U.S. Space Force, Schriever AFB CO
# That Marine Corps HITT and Navy MWR layer is the point: it is government-
# civilian and NAF hiring that never reaches a contractor's ATS, which is
# exactly the gap every other source in this file leaves open.
[[source]]
kind = "usajobs"
name = "federal"
optional = true
api_key = "${USAJOBS_API_KEY}"
user_agent = "${USAJOBS_USER_AGENT}"   # the email you registered
max_pages = 4
keywords = [
  "human performance",
  "strength and conditioning",
  "athletic trainer",
  "exercise physiologist",
  "performance dietitian",
  "cognitive performance",
  "holistic health and fitness",
  "tactical fitness",
  "sports medicine",
  "physical therapist",
]


