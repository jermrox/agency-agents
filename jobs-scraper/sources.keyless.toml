# CHECKED 2026-08-28 -- primes whose Workday tenants are now CONFIRMED to
# resolve, but which are carrying no tactical human performance work today.
# Recorded here so nobody re-guesses these coordinates, and so enabling one is
# a one-line uncomment on the day a recompete lands. They are left OFF because
# a Workday keyword search is fuzzy: "strength and conditioning" against Booz
# Allen returned seven hits, all of them engineering roles, and each hit costs
# a detail fetch the classifier then throws away.
#   bah/wd1/BAH_Jobs           HTTP 200 -- 0 tactical across all six terms
#   caci/wd1/External          HTTP 200 -- 0 tactical across all six terms
#   parsons/wd5/Search         HTTP 200 -- 0 tactical across all six terms
#   leidos/wd5/External        HTTP 200 -- 1 marginal hit, "Health and Fitness
#                              Specialist" in McLean VA, posted 30+ days ago;
#                              reads as a corporate-campus gym role, not
#                              tactical, and the classifier would reject it.
# Amentum and SAIC are NOT listed above on purpose: amentum/wd1/Amentum and
# saic/wd1/External both return HTTP 422, meaning the site slug is wrong. The
# tenant may well exist -- do not enable either until the real slug is read
# off their careers page, the same way GDIT's was.


# -----------------------------------------------------------------------------
# 2. JSON-LD -- the "tap into everything" adapter
#
# Google requires schema.org JobPosting markup for a job to surface in Google
# Jobs, so a very large share of career pages embed it -- including iCIMS,
# Taleo, and SuccessFactors sites that have no usable JSON API of their own.
# Point this at a sitemap and it reads whatever is there.
#
# This is also a keyless route at federal listings: USAJOBS announcement pages
# are public HTML, so if they carry JobPosting markup this reaches them with no
# API key. Verify with --dry-run before trusting it.
# -----------------------------------------------------------------------------

# --- VERIFIED LIVE 2026-08-28 -----------------------------------------------
# SERCO -- the current Army H2F prime ($247M ceiling, awarded Jan 2025) and,
# until today, missing from this file entirely. That was the single largest
# gap in the configuration: EMPLOYERS.md names Serco as the one employer on
# the watchlist whose award is actually recent, and nothing was fetching it.
#
# Serco runs its North America careers site on Phenom People, which has no
# JSON API but does publish schema.org JobPosting markup on every detail page
# -- exactly what this adapter is for. Confirmed end to end today:
#   * careers.serco-na.com/sitemap.xml is a sitemap INDEX with two children
#     (the adapter follows an index one level, so this resolves). lastmod was
#     the same day it was fetched.
#   * Those two children list 590 job URLs between them.
#   * A detail page carries a real JobPosting node: "H2Fit: Strength &
#     Conditioning Coach - Fort Bragg, NC", hiringOrganization "Serco USA",
#     datePosted 2026-08-23, with a 10,662-character description.
#
# NOTE THE HOSTNAME. careers.serco.com is the UK board -- every US path on it
# redirects to /gb/en. The North America site is a different host entirely.
#
# On url_include: the fragments below select 68 of the 590 URLs, and all 68
# are tactical -- H2F strength and conditioning coaches and cognitive
# performance specialists across 20+ installations, including OCONUS at Camp
# Casey Korea, Schofield Barracks HI, and Fort Wainwright AK. Fetching all 590
# would cost roughly 165MB a night to reach the same 68. Matching is a plain
# case-sensitive substring test, and "H2F" alone covers the H2F/H2Fit/H2FIT
# spellings Serco mixes. The discipline fragments after it currently add
# nothing; they are there so a future Serco athletic-trainer or dietitian
# posting is caught even if it never says H2F in the title.
#
# On locations: Serco's markup pads jobLocation with a whole recruiting radius
# -- the Fort Bragg posting lists 120 cities, from Alexandria VA to Buffalo NY,
# and the first entry is an empty locality with a Washington DC postal code.
# The adapter's max_locations guard (default 8) discards a list that long as
# padding and recovers the real place from the title instead, which is where
# Serco actually puts it. Left at the default deliberately: raising it here
# would put a screenful of wrong cities on the board.
[[source]]
kind = "jsonld"
name = "serco"
sitemap = "https://careers.serco-na.com/sitemap.xml"
employer = "Serco"
max_urls = 120
url_include = [
  "H2F",
  "Strength",
  "Conditioning",
  "Athletic-Train",
  "Dietitian",
  "Dietician",
  "Physical-Therapist",
  "Occupational-Therapist",
  "Human-Performance",
  "Cognitive-Performance",
  "Exercise-Physiolog",
]

