# -----------------------------------------------------------------------------
# 5. SPECIALIST EMPLOYERS -- standard ATS boards, all keyless
# -----------------------------------------------------------------------------

# The tokens that used to be enabled here -- greenhouse "o2x" and lever
# "teamexos" -- were checked against the live APIs on 2026-07-31 and DO NOT
# EXIST (both endpoints return not-found). They were guesses that sat in this
# file as if they were configuration. Removed rather than kept as comments a
# copy-paste could resurrect.
#
# RE-CHECKED 2026-08-28, and the specialist firms are still not reachable. Each
# careers page was fetched and read: O2X, Magellan Federal, and Resolution Think
# serve ordinary marketing pages with no JobPosting markup (only BreadcrumbList
# and LocalBusiness nodes) and no link to any ATS host; HigherEchelon, Hyperion
# Biotechnology, GAP Solutions, and EXOS all 404 at their published careers
# paths. These are small firms running careers pages by hand, which is exactly
# what a scraper cannot generalize over. Each needs its own verified route
# before it can be a [[source]]. See "Specialist firms" in EMPLOYERS.md.

# --- VERIFIED LIVE ----------------------------------------------------------
# Fetched 2026-07-31: returned a well-formed feed of current postings (items
# dated the same day). Aggregates coaching, S&C, and athletic-training roles,
# including tactical/H2F contractor listings; the classifier separates the
# tactical roles from the collegiate majority.
[[source]]
kind = "rss"
name = "simplifaster"
url = "https://jobboard.simplifaster.com/jobs/feed/"
employer = ""

# Other keyless ATS adapters, ready when you have a token:
#   ashby           board_token
#   workable        board_token
#   smartrecruiters company_id
#   recruitee       board_token
#   bamboohr        subdomain
#   breezy          company
#   personio        company
#   rippling        board_token


# -----------------------------------------------------------------------------
# 6. ASSOCIATION CAREER CENTERS
#
# NSCA, NATA, ACSM, CSCCa, and AASP run job boards that are pure signal for
# this niche. Most expose RSS. Keyless.
# -----------------------------------------------------------------------------

# --- VERIFIED LIVE 2026-08-07 -----------------------------------------------
# NSCA Career Center (nsca.careerwebsite.com). Checked end to end on this date:
#   * The board publishes NO RSS. /jobs/rss/, /jobs/feed/, ?format=rss and
#     /rss/ all return the ordinary HTML page (or 403), so the `jobsrss`
#     adapter -- which an earlier version of this file guessed at with the URL
#     https://careers.nsca.com/jobs/feed -- cannot work here.
#   * /sitemap.xml DOES resolve and lists the job detail pages.
#   * Each detail page carries schema.org JobPosting markup nested inside an
#     @graph container, which the jsonld adapter already unwraps.
# A live run over the sitemap fetched 21 postings; the classifier rejected 20
# collegiate/commercial roles and approved one tactical role -- Serco's H2FIT
# Strength and Conditioning Coaches, scoring 83.5. That ratio is the point:
# this board is mostly collegiate strength jobs, and the two-axis classifier
# is what separates the tactical minority from them.
[[source]]
kind = "jsonld"
name = "nsca"
sitemap = "https://nsca.careerwebsite.com/sitemap.xml"
url_include = ["/job/"]
max_urls = 60


# -----------------------------------------------------------------------------
# PUBLISHERS -- all keyless. Discord is the only one that would need a secret,
# and it is a webhook URL rather than an API key.
# -----------------------------------------------------------------------------

[[publisher]]
kind = "jsonfeed"
path = "output/jobs.json"
retain_days = 45

[[publisher]]
kind = "review"
path = "output/review-queue.md"

[[publisher]]
kind = "rss"
path = "output/jobs.xml"
source_feed = "output/jobs.json"
limit = 50
title = "MOPs & MOEs — Tactical Human Performance Jobs"
link = "https://www.mopsnmoes.com/jobs"
