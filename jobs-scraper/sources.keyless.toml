# -----------------------------------------------------------------------------
# 2. JSON-LD -- the "tap into everything" adapter
#
# Google requires schema.org JobPosting markup for a job to surface in Google
# Jobs, so a very large share of career pages embed it -- including iCIMS,
# Taleo, and SuccessFactors sites that have no usable JSON API of their own.
# Point this at a sitemap and it reads whatever is there.
#
# This is also a keyless route at federal listings: USAJOBS announcement pages
# are public HTML, so if they carry JobPosting markup this reaches them with no
# API key. Verify with --dry-run before trusting it.
# -----------------------------------------------------------------------------

# [[source]]
# kind = "jsonld"
# name = "example-careers"
# sitemap = "https://example.com/sitemap.xml"
# url_include = ["/job/", "/careers/"]
# max_urls = 200
# employer = "Example Employer"

# [[source]]
# kind = "jsonld"
# name = "handpicked"
# urls = [
#   "https://example.com/careers/tactical-strength-coach",
#   "https://example.com/careers/performance-dietitian",
# ]


# -----------------------------------------------------------------------------
# 3. FEDERAL, WITHOUT A KEY
#
# USAJOBS publishes RSS alongside its credentialed REST API. The generic `rss`
# adapter consumes it with no new code -- this is config, not engineering.
#
# UNVERIFIED: the exact export URL and query parameters were not confirmable
# from the build sandbox (no outbound network). Before enabling, run a USAJOBS
# search in a browser, take the RSS/export link it offers, and paste it here.
# -----------------------------------------------------------------------------

# [[source]]
# kind = "rss"
# name = "usajobs-hp"
# url = "PASTE_THE_RSS_URL_FROM_A_USAJOBS_SEARCH_HERE"
# employer = "U.S. Federal Government"


# -----------------------------------------------------------------------------
# 4. FIRE / POLICE / MUNICIPAL -- NEOGOV
#
# Fire departments, sheriff's offices, and state agencies hire wellness
# coordinators, peer fitness trainers, and embedded athletic trainers, and post
# almost exclusively to governmentjobs.com rather than to any ATS. Keyless.
# -----------------------------------------------------------------------------

# [[source]]
# kind = "governmentjobs"
# name = "example-city"
# agency = "cityofexample"
# employer = "City of Example"


# -----------------------------------------------------------------------------
# 5. SPECIALIST EMPLOYERS -- standard ATS boards, all keyless
# -----------------------------------------------------------------------------

# The tokens that used to be enabled here -- greenhouse "o2x" and lever
# "teamexos" -- were checked against the live APIs on 2026-07-31 and DO NOT
# EXIST (both endpoints return not-found). They were guesses that sat in this
# file as if they were configuration. Removed rather than kept as comments a
# copy-paste could resurrect.

# --- VERIFIED LIVE ----------------------------------------------------------
# Fetched 2026-07-31: returned a well-formed feed of current postings (items
# dated the same day). Aggregates coaching, S&C, and athletic-training roles,
# including tactical/H2F contractor listings; the classifier separates the
# tactical roles from the collegiate majority.
[[source]]
kind = "rss"
name = "simplifaster"
url = "https://jobboard.simplifaster.com/jobs/feed/"
employer = ""

# Other keyless ATS adapters, ready when you have a token:
#   ashby           board_token
#   workable        board_token
#   smartrecruiters company_id
#   recruitee       board_token
