# =============================================================================
# ZERO-CREDENTIAL CONFIGURATION
#
#   cp sources.keyless.toml sources.toml
#   python3 -m tactical_jobs run --config sources.toml --dry-run
#
# Every source below runs on a public board token or a plain URL. No API key,
# no OAuth, no account, no signup. Nothing here reads an environment variable.
#
# WHAT THIS COSTS YOU
# Of 19 adapters, exactly three need a credential: usajobs, jazzhr, teamtailor.
# None appear here. The only meaningful loss is the USAJOBS *structured* API --
# and there are two keyless routes at federal jobs anyway, both noted below.
#
# WHY THIS WORKS
# ATS vendors publish the job board that powers an employer's own careers page
# as open JSON. That is not a loophole; it is the product. The "token" is just
# the employer's public slug -- the same string that appears in the careers-page
# URL your candidates already click.
#
# !! BOARD TOKENS BELOW ARE UNVERIFIED PLACEHOLDERS !!
# Confirm each before relying on it (see "Adding an employer" in README.md).
# A wrong token surfaces as an ERROR line in the run summary, never a silent
# zero, so start with --dry-run and read the output.
# =============================================================================

[runtime]
state_path = "state/seen.json"
output_dir = "output"
max_age_days = 45
auto_publish = true

[thresholds]
publish = 14.0
review = 8.0
min_domain = 1.5
min_discipline = 3.0


# -----------------------------------------------------------------------------
# 1. WORKDAY -- the highest-value keyless source
#
# Nearly every large defense prime holding H2F, POTFF, and THOR3 work recruits
# through Workday: Leidos, Booz Allen, Amentum, KBR, CACI, SAIC, Parsons. Their
# career sites are backed by a public JSON endpoint that needs no credential.
#
# Find tenant/site from the careers URL:
#   https://{tenant}.wd1.myworkdayjobs.com/{site}
#                ^tenant  ^data_center      ^site
# -----------------------------------------------------------------------------

# NO GUESSED TENANTS RUN LIVE. Earlier versions of this file enabled Workday
# sources for "leidos" and "boozallen" -- tenant slugs typed from convention,
# never verified, for companies that research later showed are not even the
# H2F contract holders. A guessed tenant either 404s every night or, worse,
# resolves to a different business unit and quietly serves someone else's
# jobs. Every [[source]] enabled in this file must state when and how it was
# verified live. Candidates without that line stay commented out below.

# --- VERIFIED LIVE 2026-07-31 -----------------------------------------------
# KBR's Workday tenant, confirmed by fetching the Workday CXS JSON endpoint
# directly. Two POTFF requisitions returned "canApply":true and "posted":true:
#   R2127121  Special Operations Strength and Conditioning Specialist,
#             HQ AFSOC, Hurlburt Field FL
#   R2122466  Special Operations Certified Athletic Trainer,
#             AFSOC GSU Southern Pines NC (req located Fort Liberty NC)
# Coordinates read off those live responses, not guessed:
#   tenant=kbr  data_center=wd5  site=KBR_Careers
# Note the public HTML URL 403s to non-browser fetchers; the cxs JSON path
# is what the adapter uses, which is why this resolves where a browser fetch
# would not.
[[source]]
kind = "workday"
name = "kbr"
tenant = "kbr"
site = "KBR_Careers"
data_center = "wd5"
employer = "KBR"
search_terms = [
  "strength and conditioning",
  "athletic trainer",
  "human performance",
  "performance dietitian",
  "cognitive performance",
  "physical therapist",
]

