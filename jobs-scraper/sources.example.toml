# -----------------------------------------------------------------------------
# Example configuration. Copy to sources.toml and edit.
#
#   cp sources.example.toml sources.toml
#   python3 -m tactical_jobs run --config sources.toml --dry-run
#
# Secrets are never written here. Use ${ENV_VAR} and set the variable in the
# environment (or in GitHub Actions secrets). A referenced-but-unset variable
# is a hard error at startup rather than a silent empty string.
#
# !! THE BOARD TOKENS BELOW ARE UNVERIFIED PLACEHOLDERS !!
# Each employer's real token has to be confirmed before it will return
# anything. See "Adding an employer" in README.md for the 30-second check.
# `run --dry-run` reports each source that fails, so a wrong token is loud,
# not silent.
# -----------------------------------------------------------------------------

[runtime]
state_path = "state/seen.json"
output_dir = "output"

# Drop postings older than this many days. Stale listings are worse than none.
max_age_days = 45

# Postings scoring at/above the `publish` threshold go live on their own.
# Anything between `review` and `publish` still lands in the review queue, so
# the borderline cases get eyes without holding up the clear matches.
# Set false to gate everything behind manual approval instead.
auto_publish = true


# -----------------------------------------------------------------------------
# Scoring thresholds
#
# Scoring runs on two axes and a posting must clear the floor on BOTH:
#   domain     -- is the population tactical? (military, SOF, LE, fire)
#   discipline -- is the work human performance? (S&C, ATC, RD, cognitive)
#
# That is what keeps "Strength Coach, Ohio State" and "Performance Engineer,
# Lockheed" off the board. Tune with:
#   python3 -m tactical_jobs classify --title "..." --description "..."
# -----------------------------------------------------------------------------
[thresholds]
publish = 14.0        # at/above this, good enough to publish
review = 8.0          # at/above this, worth a human look
min_domain = 1.5      # floor on the tactical axis
min_discipline = 3.0  # floor on the human-performance axis


# -----------------------------------------------------------------------------
# Sources
#
# Every adapter here talks to a vendor's documented public job-board API --
# the same JSON that powers the employer's own careers page.
#
# Deliberately absent: Indeed, ZipRecruiter, LinkedIn, Glassdoor. Their terms
# prohibit automated collection and they actively block it. Do not add them.
# -----------------------------------------------------------------------------

# --- USAJOBS: the single highest-value source for this niche -----------------
# Army H2F, Navy/Air Force human performance billets, and DoD sports-medicine
# roles post here first and often nowhere else.
# Free API key: https://developer.usajobs.gov/apirequest/
[[source]]
kind = "usajobs"
name = "federal"
api_key = "${USAJOBS_API_KEY}"
user_agent = "${USAJOBS_USER_AGENT}"   # the email you registered
max_pages = 4
keywords = [
  "human performance",
  "strength and conditioning",
  "athletic trainer",
  "exercise physiologist",
  "performance dietitian",
  "cognitive performance",
  "holistic health and fitness",
]

# --- Employer ATS boards -----------------------------------------------------
# Contractors holding H2F / POTFF / THOR3 work are where most non-federal
# tactical human performance hiring happens.

[[source]]
kind = "greenhouse"
name = "o2x"
board_token = "o2x"          # UNVERIFIED -- confirm before relying on it
employer = "O2X Human Performance"

[[source]]
kind = "lever"
name = "exos"
board_token = "teamexos"     # UNVERIFIED -- confirm before relying on it
employer = "EXOS"

