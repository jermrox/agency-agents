# --- Generic RSS: escape hatch for boards with no supported adapter ----------
# Feeds carry less structure than an ATS API, so these tend to score lower and
# land in review. That is correct behavior, not a bug.
# [[source]]
# kind = "rss"
# name = "example-feed"
# url = "https://example.com/careers/feed"
# employer = "Example Employer"


# -----------------------------------------------------------------------------
# Publishers
#
# Clear matches (score >= thresholds.publish) go to the live publishers.
# Borderline matches go to the review publisher. Both happen in the same run.
# -----------------------------------------------------------------------------

# THE WEBSITE. This is the primary destination.
# Writes the board that the Squarespace page renders. Host this file somewhere
# with CORS + HTTPS (GitHub Pages is free), then paste
# embed/squarespace-jobs.html into a Code Block on the jobs page and point its
# FEED_URL at it. Squarespace has no content-write API, so this is how a job
# gets onto mopsnmoes.com without anyone touching the site.
[[publisher]]
kind = "jsonfeed"
path = "output/jobs.json"
retain_days = 45

# Borderline matches only -- the audit trail. Keep this on.
[[publisher]]
kind = "review"
path = "output/review-queue.md"

# Renders the whole live board (read from source_feed), not just this run's
# new arrivals -- otherwise a quiet run would blank the feed. Keep this
# AFTER the jsonfeed publisher so it reads a freshly written board.
[[publisher]]
kind = "rss"
path = "output/jobs.xml"
source_feed = "output/jobs.json"
limit = 50
title = "MOPs & MOEs — Tactical Human Performance Jobs"
link = "https://www.mopsnmoes.com/jobs"

# Optional second destination, on top of the website -- not instead of it.
# The mopsnmoes.com homepage already points people to Discord for job
# openings, so mirroring there costs nothing once the site board is live.
# Server Settings -> Integrations -> Webhooks.
# Uncomment and set DISCORD_WEBHOOK_URL together: an enabled publisher whose
# ${VAR} is unset is a hard startup error, not a silent no-op.
# [[publisher]]
# kind = "discord"
# webhook_url = "${DISCORD_WEBHOOK_URL}"
# username = "MOPs & MOEs Job Bot"

# Generic JSON POST -- drives a Zapier/Make scenario, a Cloudflare Worker, or
# any CMS that does accept writes.
