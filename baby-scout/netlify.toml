# Baby Gear Dashboard -- its own Netlify project, separate from the sites that
# build from the repository root (those use ../netlify.toml and never publish
# this dashboard).
#
# Netlify setup (once): Add new site -> Import from Git -> this repository,
# then set **Base directory** to `baby-scout`. Netlify reads THIS file from the
# base directory; leave the build command and publish directory fields empty so
# the values below apply.
#
# Nothing is built on Netlify. The daily GitHub workflow
# (.github/workflows/baby-scout-daily.yml) runs the scout, saves the day's
# report and commits the finished dashboard to site/; this project just
# publishes that folder on each push.

[build]
  # Fail the deploy loudly rather than publish an empty site.
  command = "test -s site/index.html || (echo 'site/index.html missing: run the Baby Scout daily workflow first' >&2; exit 1)"
  publish = "site"
  # Only redeploy when something under baby-scout/ changed (runs from the base
  # directory, so "." is baby-scout/). Exit 0 = skip; a failed diff builds.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # A household's due date, budget and purchases: keep it out of search engines.
    X-Robots-Tag = "noindex, nofollow"

# The page changes every day; make sure browsers ask for the new one.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
