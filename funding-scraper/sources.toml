# Broad agency announcements are titled institutionally, not topically, so the
# thirteen topic queries above cannot see them. That is not hypothetical: the
# Air Force Research Laboratory Human Effectiveness Directorate BAA -- CHEERS,
# FA238424S2233, open now and running to 2044, the single most on-mission
# federal vehicle for a physiological wearable -- was missing from this board
# entirely. Its title is an acronym expansion and its text says "Human
# Effectiveness Directorate", never "human performance", so every keyword we
# had went past it. Found by the unfiltered recall probe, not by the filters.
# Keyword is a loose OR and every query is capped at rows x pages = 300
# records, so a five-word query buries a specific target under hundreds of
# loose matches. "human effectiveness" is the narrow, high-signal phrase --
# it is what AFRL/RH calls itself and almost nothing else uses.
[sources.grants_baa]
kind = "grants_gov"
keyword = "human effectiveness"
rows = 100
pages = 5
statuses = "forecasted|posted"
eligibilities = "23|25|99"
exclude_any = [
  "forestry", "conservation", "wildlife", "habitat", "fishery", "agricultur",
  "crop", "livestock", "watershed", "hydrolog", "crocodile", "wildland fire",
  "ghana", "indonesia", "sub-saharan", "global health security", "foreign assistance",
  "democracy", "civics", "election", "prescription drug monitoring",
]
require_any = [
  "wearable", "sensor", "biosensor", "biometric", "physiolog", "photoplethysm",
  "heart rate", "hrv", "sleep", "actigraph", "accelerometer", "continuous monitoring",
  "remote patient", "digital health", "mhealth", "telehealth", "health technolog",
  "human performance", "readiness", "fatigue", "warfighter", "soldier",
  "medical device", "diagnos", "signal processing", "algorithm", "machine learning",
  "altimet", "altitude", "barometr", "hypox", "oxygen saturation", "spo2",
  "thermal", "heat strain", "hydration", "core temperature", "cognitive load",
  "human effectiveness", "human systems", "aerospace medicine", "operational medicine", "human factors", "biomedical research", "soldier performance",
]

# ANSWER TO THE EXPERIMENT BELOW: keyword matches the opportunity NUMBER.
# Querying FA238424S2233 returns the whole CHEERS family -- three records,
# including "CHEERS Open Period 2 - All Technical Areas" (FA238424S2335,
# closing 2027-09-30) which no topic keyword had ever surfaced.
#
# That makes this scraped rather than hand-curated, which matters: a scraped
# row re-reads its own close date every sweep, so it goes closed on its own
# when AFRL closes it. The curated entry it replaces could not do that.
#
# The general lesson is reusable -- any record whose number is known can be
# pinned exactly, regardless of how untopical its title is.
[sources.grants_afrl_cheers]
kind = "grants_gov"
keyword = "FA238424S2233"
rows = 100
pages = 1
statuses = "forecasted|posted"
# NO require_any, deliberately. The relevance filter runs BEFORE enrichment,
# so it only ever sees the search response -- and grants.gov search2 returns
# no description field at all, only a title. Every CHEERS record was dropped
# on that basis: "CHEERS Open Period 2 - All Technical Areas" carries no
# topical vocabulary in its title, and the "Human Effectiveness Directorate"
# text that would have matched lives in the description the filter cannot see.
#
# A keyword filter on a query pinned to one opportunity number is redundant
# anyway: the number IS the filter.

# ONE bounded experiment on what grants.gov `keyword` actually matches, so the
# CHEERS record stops being an unexplained curation. Three disabled probes,
# run together with --only, no require_any on any of them -- this asks what
# the API returns, not what we would keep:
#   _title  the record's exact title. A hit means keyword reads the title.
#   _number the opportunity number. A hit means there is an id-style lookup,
#           which would let any known record be pinned exactly.
#   _phrase the description-only phrase. A hit means keyword reads the body
#           and the earlier misses were ranking or the result window.
# Whichever hits tells us how to reach records like this one; all three
# missing says keyword does not reach it at all and curation was correct.
[sources.probe_cheers_title]
kind = "grants_gov"
keyword = "Continuing Human Enabling Enhancing Restoring and Sustaining"
rows = 100
pages = 1
statuses = "forecasted|posted"
enabled = false

[sources.probe_cheers_number]
kind = "grants_gov"
keyword = "FA238424S2233"
rows = 100
pages = 1
statuses = "forecasted|posted"
enabled = false

[sources.probe_cheers_phrase]
kind = "grants_gov"
keyword = "Human Effectiveness Directorate"
rows = 100
pages = 1
statuses = "forecasted|posted"
enabled = false

# Recall checks on the two agency probes. Same queries, no keyword filter,
# permanently disabled, run with --only. The NSF probe dropped 132 of 132
# records as off-topic; a filter that rejects everything it sees is either
# correct or broken, and those look identical in a summary line.
[sources.grants_nsf_unfiltered]
kind = "grants_gov"
keyword = "small business innovation research sensor"
agencies = "NSF"
rows = 100
pages = 3
statuses = "forecasted|posted"
eligibilities = "23|25|99"
enabled = false

[sources.grants_arpa_h_unfiltered]
kind = "grants_gov"
keyword = "ARPA-H advanced research projects agency health"
rows = 100
pages = 3
statuses = "forecasted|posted"
eligibilities = "23|25|99"
enabled = false

# A recall check on the block above, not a source of rows. Same adapter, no
# keyword filter, permanently disabled -- `--only dod_sbir_unfiltered --verbose`
# lists every open and pre-release DoD topic so the require_any list can be
# judged on what it DROPS, not only on what it keeps. Tightening a filter to
# kill false positives is exactly how real opportunities go missing silently,
# and this is the cheapest way to see that happening.
[sources.dod_sbir_unfiltered]
kind = "dod_sbir"
pages = 30
enabled = false

