# -----------------------------------------------------------------------------
# 2b. DoD SBIR/STTR open topics (DSIP)
# -----------------------------------------------------------------------------
# DoD topics are not posted to grants.gov, and SBIR.gov -- the one documented
# aggregator carrying them -- has refused every request since the programs'
# authorization lapse. Without this block the single most relevant federal
# layer for a warfighter-facing wearable (DARPA, Army, Navy, Air Force, DHA)
# is invisible to the board.
#
# The DSIP backend is undocumented, so the adapter tries three candidate
# endpoints and fails loudly naming each one. An unrecognised response shape
# yields zero rows, never a wrong row.
#
# WHY A TIGHTER require_any THAN THE GRANTS.GOV BLOCKS
# Every DoD topic is defense work, so "readiness", "algorithm" and "machine
# learning" -- which are discriminating on grants.gov -- admit most of the
# corpus here. This list names the physiology and wearable-sensing vocabulary
# instead, and leaves the generic terms out.
[sources.dod_sbir]
kind = "dod_sbir"
# Page budget for the topic list. The filtered search returns HTTP 500, so the
# open topics are found by walking the plain list and filtering on the
# topicStatus each record carries. 30 pages x 100 covers 3,000 topics; the walk
# stops early on a short page or one adding no new ids, so this is a ceiling,
# not a cost.
pages = 30
# Enabled after four read-only runs proved it end to end:
#   - dates parse (they are epoch milliseconds, not strings)
#   - topicStatus gates the rows: of 3,000 topics, 2,959 are Closed
#   - the keyword filter was audited in BOTH directions -- the false positives
#     it used to admit are gone, and an unfiltered run of all 41 open and
#     pre-release topics confirmed it drops nothing Vybe could win
# The audit that earns the next change of this line is `--only
# dod_sbir_unfiltered --verbose`, defined below.
default_amount = "SBIR Phase I scale"
# The first live run proved three of these terms too loose for a corpus that
# is entirely defense engineering. "signal processing" admitted a radar
# probability-of-detection topic, "fatigue" admitted fretting fatigue in naval
# aerospace metal, and "physiolog" admitted a microphysiological immunogenicity
# assay. Each is replaced by the phrase that was actually meant.
require_any = [
  "wearable", "biosensor", "biometric", "photoplethysm",
  "heart rate", "hrv", "sleep", "actigraph", "continuous monitoring",
  "human performance", "warfighter performance", "soldier performance",
  "physiological monitoring", "physiological sensing", "physiological status",
  "operator fatigue", "crew fatigue", "sleep deprivation",
  "cognitive load", "cognitive performance", "cognitive readiness",
  "health monitoring", "remote monitoring", "telehealth", "digital health",
  "medical device", "vital sign", "hypox", "oxygen saturation", "spo2",
  "heat strain", "hydration", "core temperature", "thermal strain",
  "metabolic", "on-body", "body-worn", "wearable sensor",
  "biosignal", "physiological signal",
  "human effectiveness", "human systems", "aerospace medicine", "operational medicine", "human factors", "biomedical research", "warfighter",
  "consumer health", "personal health", "health literacy", "behavior change", "behavioral intervention", "self-management", "patient engagement", "health coaching", "circadian", "recovery", "nutrition", "conversational ai", "large language model", "clinical decision support", "preventive health", "chronic disease management",
]
# Domains that share vocabulary with physiological sensing but are not Vybe's.
# Word-boundary matched, and this list runs before require_any.
exclude_any = [
  "radar", "sonar", "hull", "missile", "munition", "propulsion", "turbine",
