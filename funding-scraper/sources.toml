# =============================================================================
# VYBE FUNDING SWEEP -- ZERO-CREDENTIAL CONFIGURATION
#
#   python3 -m vybe_funding run --config sources.toml --dry-run
#
# Every source runs on an open public API or a hand-verified entry. No API key,
# no OAuth, no account. Nothing here reads an environment variable.
#
# TWO LAYERS, ON PURPOSE
#   1. API sources (sbir.gov, grants.gov) -- self-maintaining. Close dates come
#      from the agency, so a solicitation that closes tomorrow is marked closed
#      the day after without anyone touching this file.
#   2. The curated layer -- state programs, university vehicles, cloud credits
#      and accelerators that publish a web page and nothing machine-readable.
#      Every entry carries `verified`, the date a human last confirmed it. The
#      run warns when one ages past `stale_days` so this list rots visibly.
# =============================================================================

[runtime]
output_dir = "output"
# Warn when a hand-verified entry has not been rechecked in this many days.
# Tuned to the biweekly sweep cadence: ~3 sweeps before a nag.
stale_days = 45


# -----------------------------------------------------------------------------
# 1. SBIR.gov -- all eleven federal SBIR/STTR agencies in one keyless call
# -----------------------------------------------------------------------------
[sources.sbir]
kind = "sbir_gov"
rows = 300
# Keyword gate. A solicitation must mention one of these in its title or
# description to reach the board -- without it this returns several hundred
# rows a cycle, most of them submarine hulls and reactor coatings.
keywords = [
  "wearable", "sensor", "biosensor", "physiological", "human performance",
  "digital health", "remote monitoring", "signal processing", "biometric",
  "sleep", "fatigue", "cognitive", "health monitoring", "telehealth",
]
default_amount = "Phase I scale"


# -----------------------------------------------------------------------------
# 2. Grants.gov -- everything federal that is not SBIR/STTR
# -----------------------------------------------------------------------------
# One block per keyword: the API takes a single keyword string, and separate
# blocks keep a zero-result term visible in the run summary instead of hiding
# inside a combined query.

# WHY SO MANY QUERIES, AND WHY eligibilities = "23|25|99"
# Grants.gov's keyword is a loose OR, so one query cannot both reach far enough
# and stay on topic. The answer is many narrow queries plus the require_any
# vocabulary below: breadth from the queries, precision from the filter, and
# every drop counted in the run log.
#
# eligibilities = "23|25|99" is small businesses, other, and unrestricted.
# Vybe is a small business, so without this the board fills with university-
# and 501(c)(3)-only programs: rows that read as opportunities but that Vybe
# cannot legally win. 23 is the small-business code -- 22 is for-profits OTHER
# than small businesses, which excludes exactly what Vybe is, so filtering on
# it loses the best rows on the board. 25 and 99 keep programs that name no
# restriction, rather than assuming an unlabelled program is closed to us.
#
# rows = 100 is the API's page cap, and pages = 3 walks up to three pages via
# startRecordNum. The old single page of 40 left real solicitations unread.

[sources.grants_wearable]
kind = "grants_gov"
keyword = "wearable sensor"
rows = 100
pages = 3
statuses = "forecasted|posted"
eligibilities = "23|25|99"
exclude_any = [
  "forestry", "conservation", "wildlife", "habitat", "fishery", "agricultur",
  "crop", "livestock", "watershed", "hydrolog", "crocodile", "wildland fire",
  "ghana", "indonesia", "sub-saharan", "global health security", "foreign assistance",
  "democracy", "civics", "election", "prescription drug monitoring",
  # Single-disease research programmes. Vybe is a consumer personal-health
  # product with no disease indication, no clinical trial arm and no
  # diagnostic claim, so these are unwinnable however well the keywords match.
  "alzheim", "dementia", "adrd", "parkinson", "huntington", "amyotrophic",
  "multiple sclerosis", "epilep", "oncolog", "cancer", "tumor", "tumour",
  "leukemia", "lymphoma", "melanoma", "carcinoma", "metasta",
  "hiv/aids", "tuberculosis", "malaria", "hepatitis", "vaccine",
  "cystic fibrosis", "sickle cell", "rare disease", "gene therapy",
  "spinal cord injury", "prosthe", "organ transplant", "wound healing",
  "tick-borne", "tickborne", "lyme disease", "type 2 diabetes", "obesity research center",
  # A required clinical trial is a hard disqualifier, not a topic mismatch:
  # Vybe has no trial arm, no IRB and no clinical infrastructure, so an
  # award that mandates one cannot be won as prime however well it reads.
  "clinical trial required", "clinical trail required",
]
require_any = [
  "wearable", "sensor", "biosensor", "biometric", "physiolog", "photoplethysm",
  "heart rate", "hrv", "sleep", "actigraph", "accelerometer", "continuous monitoring",
  "remote patient", "digital health", "mhealth", "telehealth", "health technolog",
  "human performance", "readiness", "fatigue", "warfighter", "soldier",
  "medical device", "signal processing", "algorithm", "machine learning",
  "altimet", "altitude", "barometr", "hypox", "oxygen saturation", "spo2",
  "thermal", "heat strain", "hydration", "core temperature", "cognitive load",
  "human effectiveness", "human systems", "aerospace medicine", "operational medicine", "human factors", "biomedical research", "soldier performance",
  "consumer health", "personal health", "health literacy", "behavior change", "behavioral intervention", "self-management", "patient engagement", "health coaching", "circadian", "recovery", "nutrition", "conversational ai", "large language model", "clinical decision support", "preventive health", "chronic disease management",
]


